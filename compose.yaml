services:
  launch-prototype:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LAUNCH_DATA_DIR: /app/data
      LAUNCH_OUT_DIR: /app/out
      LAUNCH_LOG_DIR: /app/logs
      LAUNCH_PORT: "8000"
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
      - ./logs:/app/logs
    restart: unless-stopped
